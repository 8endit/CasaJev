const $=id=>document.getElementById(id),desktopMode=window.casajevDesktop?.active===true;let cid=localStorage.getItem('casajev.chat')||crypto.randomUUID(),attachments=[],busy=false,signature='',browserOpen=false,browserBusy=false,pageInfo=null,frame=0,browserQueue=Promise.resolve(),browserPending=0,drafts=new Map();localStorage.setItem('casajev.chat',cid);if(desktopMode)document.body.classList.add('desktop-mode');

function chips(){const box=$('attachments');box.replaceChildren(...attachments.map((a,i)=>{const e=node('span',undefined,'chip');e.append(node('span',a.name));const b=node('button','×');b.type='button';b.title='Anhang entfernen';b.onclick=()=>{attachments.splice(i,1);chips()};e.append(b);return e}))}
function inlineText(text){const e=node('span');const pattern=/\*\*([^*]+)\*\*|`([^`]+)`/g;let pos=0;for(const m of text.matchAll(pattern)){e.append(document.createTextNode(text.slice(pos,m.index)));e.append(node(m[1]?'strong':'code',m[1]||m[2]));pos=m.index+m[0].length}e.append(document.createTextNode(text.slice(pos)));return e}
function richText(text){const e=node('div');const pattern=/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;let pos=0;for(const m of text.matchAll(pattern)){e.append(inlineText(text.slice(pos,m.index)));const a=node('a',m[1]);a.href=m[2];a.rel='noopener noreferrer';a.target='_blank';a.onclick=ev=>{ev.preventDefault();setBrowser(true);browserAction('navigate',{url:m[2]})};e.append(a);pos=m.index+m[0].length}e.append(inlineText(text.slice(pos)));return e}
function render(convo){const next=JSON.stringify(convo);if(next===signature)return;signature=next;busy=convo.messages.some(m=>m.status==='working');$('send').disabled=busy;$('stop').classList.toggle('hidden',!busy);$('send').classList.toggle('hidden',busy);$('empty').hidden=convo.messages.length>0;const list=[];for(const m of convo.messages){const e=node('div',undefined,'message '+m.role);if(m.role==='assistant'){e.append(node('div','CasaJev','label'));if(m.status==='working'){const w=node('div',undefined,'working');w.append(node('span','','dot'),node('span',m.progress||(m.task_id?'Ich arbeite daran …':'Einen Moment …')));e.append(w)}else e.append(richText(m.text));if(m.result!==undefined&&m.result!==null)e.append(typeof renderResult==='function'?renderResult(m.result):node('pre',JSON.stringify(m.result,null,2),'result'));if(m.sources?.length){const sources=node('div',undefined,'sources');for(const source of m.sources){try{const u=new URL(source.url);if(!['http:','https:'].includes(u.protocol))continue;const a=node('a',source.title||u.hostname);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.onclick=ev=>{ev.preventDefault();setBrowser(true);browserAction('navigate',{url:u.href})};sources.append(a)}catch{}}e.append(sources)}if(typeof messageActions==='function')e.append(messageActions(m,convo));if(m.elapsed_seconds!==undefined)e.append(node('div',(m.browser_seconds!==undefined?'Browser '+m.browser_seconds.toFixed(1)+' s · ':'')+m.elapsed_seconds.toFixed(1)+' s gesamt','timing'));}else{e.append(node('div',m.text));if(m.attachments?.length)e.append(node('div',m.attachments.join(' · '),'footnote'))}list.push(e)}$('messages').replaceChildren(...list);$('scroll').scrollTop=$('scroll').scrollHeight}
async function refresh(){const requested=cid;try{const convo=await api('/api/chat/'+requested);if(cid!==requested)return;render(convo);if($('error').textContent==='Der lokale Server ist gerade nicht erreichbar.')$('error').textContent=''}catch(e){if(cid===requested)$('error').textContent='Der lokale Server ist gerade nicht erreichbar.'}}
$('form').onsubmit=async e=>{e.preventDefault();const message=$('message').value.trim();if(!message||busy)return;const submitted=cid;const sentAttachments=attachments;busy=true;$('error').textContent='';$('send').disabled=true;try{await api('/api/chat',{conversation:submitted,message,attachments:sentAttachments});drafts.delete(submitted);if(cid!==submitted)return;$('message').value='';$('message').style.height='auto';attachments=[];chips();await refresh()}catch(e){if(cid===submitted){$('error').textContent=e.message;busy=false;$('send').disabled=false}}};
$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit()}};$('message').oninput=()=>{$('message').style.height='auto';$('message').style.height=Math.min($('message').scrollHeight,220)+'px'};
function switchChat(next,existing=false){drafts.set(cid,{text:$('message').value,attachments:[...attachments]});cid=next;localStorage.setItem('casajev.chat',cid);signature='';pageInfo=null;$('address').value='';$('browserstatus').textContent='Eigene Browser-Sitzung dieses Chats';$('browserblank').classList.remove('hidden');$('screen').classList.add('hidden');const draft=drafts.get(cid);attachments=draft?.attachments||[];$('message').value=draft?.text||'';$('message').style.height='auto';chips();$('error').textContent='';render({id:cid,messages:[]});syncDesktopBrowser();if(browserOpen)browserAction('state');if(existing){busy=true;$('send').disabled=true;refresh()}$('historyDialog').close();$('message').focus()}
$('new').onclick=()=>switchChat(crypto.randomUUID());
async function showHistory(){const dialog=$('historyDialog');if(!dialog.open)dialog.showModal();$('historyList').replaceChildren(node('div','Lädt …','history-empty'));try{const data=await api('/api/chats');const entries=data.conversations.map(item=>{const row=node('div',undefined,'history-row'),button=node('button',undefined,'history-item'),more=node('button','Verwalten','history-more');button.type='button';button.setAttribute('aria-current',String(item.id===cid));button.append(node('span',item.title,'history-title'));const meta=item.status==='working'?'Arbeitet …':item.updated_at?new Date(item.updated_at*1000).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'Gespeichert';button.append(node('span',meta,'history-meta'));button.onclick=()=>switchChat(item.id,true);more.type='button';more.setAttribute('aria-label','Chat verwalten: '+item.title);more.onclick=()=>chatMenu(item);row.append(button,more);return row});$('historyList').replaceChildren(...(entries.length?entries:[node('div','Noch keine gespeicherten Chats.','history-empty')]))}catch(e){$('historyList').replaceChildren(node('div','Die Chats konnten nicht geladen werden. Bitte erneut öffnen.','history-empty'))}}
$('historyToggle').onclick=showHistory;$('closeHistory').onclick=()=>$('historyDialog').close();$('historyDialog').onclick=e=>{if(e.target===$('historyDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}};
async function addFiles(files){for(const file of files){if(attachments.length>=5)break;if(file.size>200000){$('error').textContent='Bitte eine Text-, CSV- oder JSON-Datei bis 200 KB wählen.';continue}attachments.push({name:file.name,content:await file.text()})}chips()}
$('attach').onclick=()=>$('file').click();$('file').onchange=()=>{addFiles($('file').files);$('file').value=''};$('form').ondragover=e=>e.preventDefault();$('form').ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)};
function syncDesktopBrowser(){if(!desktopMode)return;const r=$('browserstage').getBoundingClientRect();window.casajevDesktop.setBrowserBounds({conversation:cid,x:r.left,y:r.top,width:r.width,height:r.height,visible:browserOpen})}

function browserAction(action,data={}){if(action==='state'&&browserPending)return Promise.resolve();const conversation=cid;browserPending++;browserBusy=true;const perform=async()=>{try{if(action!=='state'&&cid===conversation)$('browserstatus').textContent='Lädt …';const p=await api('/api/browser',{action,conversation,...data});if(cid===conversation){paintPage(p);$('error').textContent=''}}catch(e){if(cid===conversation)$('browserstatus').textContent=e.message}finally{browserPending--;browserBusy=browserPending>0}};browserQueue=browserQueue.then(perform,perform);return browserQueue}

$('address').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();navigate()}};$('go').onclick=navigate;$('back').onclick=()=>browserAction('back');$('reload').onclick=()=>browserAction('reload');
